<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>판매 수수료 6%만 빼면 될까요? 주문 비용을 빠짐없이 정리하는 법 — 활용 자료</title><style>body{margin:0;background:#f7f3eb;color:#243d35;font-family:"Malgun Gothic",system-ui,sans-serif}main{max-width:820px;margin:auto;padding:30px;background:white;font-size:18px;line-height:1.9;overflow-wrap:anywhere}h1{font-size:32px;line-height:1.45}h2{font-size:25px;line-height:1.5;margin:44px 0 18px}p{margin:0 0 20px}figure{margin:30px 0}img{width:100%;height:auto}figcaption,small{font-size:14px;color:#5d6e65}a{color:#136851}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border:1px solid #cbd7cf;padding:9px;overflow-wrap:anywhere}nav{padding:16px;background:#f1f5f2;border-radius:12px}nav a{display:block;padding:4px}textarea{font-family:inherit}@media(max-width:480px){main{padding:16px;font-size:17px}h1{font-size:26px}h2{font-size:23px}td,th{padding:5px}}@media print{body{background:white}main{max-width:none}nav{display:none}}</style></head><body><nav aria-label="도구 목록" style="padding:12px 20px"><a href="../../index.html">실무 도구 전체 보기</a></nav><div class="md-article"><main><h1>판매 수수료 6%만 빼면 될까요? 주문 비용을 빠짐없이 정리하는 법 — 활용 자료</h1><section id="mdtool-005" aria-label="독자 계산기"><style>#mdtool-005{background:#f1f7f4;border:1px solid #c5d8cf;border-radius:16px;padding:20px;margin:30px 0;box-sizing:border-box}#mdtool-005 *{box-sizing:border-box}#mdtool-005 form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}#mdtool-005 label{display:block;font-size:16px}#mdtool-005 input[type=number],#mdtool-005 textarea{display:block;width:100%;padding:12px;font:inherit;border:1px solid #7e9b8c;border-radius:8px;background:white;margin-top:6px}#mdtool-005 textarea{min-height:90px}#mdtool-005 button{padding:12px 16px;margin:14px 8px 0 0;border:0;border-radius:8px;background:#204c40;color:white;font:inherit;cursor:pointer}#mdtool-005 button:focus-visible,#mdtool-005 input:focus-visible,#mdtool-005 textarea:focus-visible{outline:3px solid #cc603e;outline-offset:2px}#mdtool-005 .results{display:grid;gap:10px;margin-top:18px}#mdtool-005 .result{background:white;border-left:4px solid #ce6447;padding:12px;border-radius:7px}#mdtool-005 .result b{display:block;font-size:23px}#mdtool-005 .error{color:#a02e26}#mdtool-005 .check{padding:12px;background:white;border-radius:8px;margin-bottom:8px}#mdtool-005 input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px}@media print{#mdtool-005 button{display:none}}</style><h3>내 조건으로 계산해보세요</h3><form><label>판매가 (원)<input type="number" name="v0" min="0" step="any" value="30000" required></label><label>상품원가 (원)<input type="number" name="v1" min="0" step="any" value="15000" required></label><label>수수료율 (%)<input type="number" name="v2" min="0" step="any" value="6" required></label><label>택배비 (원)<input type="number" name="v3" min="0" step="any" value="3000" required></label><label>포장비 (원)<input type="number" name="v4" min="0" step="any" value="500" required></label><label>수수료만 차감한 정산금 (원)<input type="number" name="v5" min="0" step="any" value="28200" required></label></form><button type="button" data-reset>예시로 초기화</button><div class="results" role="status" aria-live="polite"></div><p>판매가 경로 = 판매가−원가−수수료−택배−포장. 정산금 경로 = 정산금−원가−택배−포장. 정산금에서는 수수료만 차감됐다고 가정합니다.</p><p>별도 명시한 올림 외에는 금액은 원 단위 반올림, 비율·예상 수량·일수는 소수 둘째 자리까지 표시합니다. 반올림 전 값으로 계산합니다. 가상 비교용이며 부가세 효과·고정비는 별도 반영하지 않습니다. 입력값은 저장하거나 전송하지 않습니다.</p><noscript><p>JavaScript가 꺼져 있어 입력 계산을 사용할 수 없습니다. 위 계산식과 본문의 예시를 이용해 주세요.</p></noscript><script>(()=>{function compute(id,v){
if(v.some(x=>String(x).trim()===''||!Number.isFinite(Number(x))||Number(x)<0))throw Error('빈칸 없이 0 이상의 유한한 숫자를 입력해 주세요.');
const x=v.map(Number),[a,b,c,d,e,f]=x; const need=(ok,msg)=>{if(!ok)throw Error(msg)},pct=n=>need(n<=100,'비율은 100% 이하여야 합니다.'),integer=n=>need(Number.isSafeInteger(n),'건수·수량·일수는 정수로 입력해 주세요.');const row=(label,value,unit='원')=>({label,value,unit});
const ceil=n=>Math.ceil(n-Number.EPSILON*Math.max(1,Math.abs(n))*4);
let out;
switch(id){
case '005':pct(c);out=[row('판매가 기준 기여금',a-b-a*c/100-d-e),row('정산금 기준 기여금',f-b-d-e),row('두 경로의 차이',a-a*c/100-f)];break;
case '006':need(c<100,'수수료율은 100% 미만이어야 합니다.');integer(e);need(e>=2,'묶음 수량은 2개 이상이어야 합니다.');{const old=e*(a*(1-c/100)-b-d),bundle=f*(1-c/100)-e*b-d;out=[row('낱개 여러 주문 합계',old),row('묶음 한 주문 기여금',bundle),row('묶음의 차이',bundle-old),row('같은 기여금의 최소 묶음가',ceil((old+e*b+d)/(1-c/100)))];}break;
case '007':pct(b);pct(c);need(b+c<=100,'같은 원금 비교를 위해 할인율 합계는 100% 이하로 입력하세요.');need(a>0,'정상가는 0보다 커야 합니다.');out=[row('순차 적용 가격',a*(1-b/100)*(1-c/100)),row('같은 원금 적용 가격',a*(1-(b+c)/100)),row('순차 적용 실제 할인율',(1-(1-b/100)*(1-c/100))*100,'%')];break;
case '008':out=[row('입금 전 잔액',a-b),row('부족액',Math.max(0,b-a)),row('입금 후 잔액',a-b+c)];break;
case '009':integer(a);integer(b);need(a>0&&b<=a,'전체 주문은 1건 이상, 반품은 전체 이하로 입력하세요.');{const total=(a-b)*c-b*d;out=[row('반품 반영 기여금 합계',total),row('반품 없는 경우 대비 감소',a*c-total),row('주문 기준 반품률',b/a*100,'%')];}break;
case '010':integer(a);pct(c);out=[row('발급 액면 금액',a*b),row('가정한 액면 사용액',a*b*c/100),row('가상 미사용 잔액',a*b*(1-c/100))];break;
case '012':integer(a);pct(c);need(a>0&&d>0,'클릭 수와 주문 기여금은 0보다 커야 합니다.');out=[row('예상 주문 수',a*c/100,'건'),row('광고비',a*b),row('광고 후 기여금',a*c/100*d-a*b),row('광고비 회수 전환율',b/d*100,'%')];break;
case '013':pct(b);need(a>0&&c<=a,'주문 기여금은 양수, 목표 금액은 그 이하이어야 합니다.');out=[row('광고비 회수 평균 CPC',a*b/100),row('목표 평균 CPC',(a-c)*b/100)];break;
case '015':integer(a);integer(b);integer(c);need(c>0&&b>0,'기간과 판매량은 0보다 커야 소진 기간을 계산할 수 있습니다.');out=[row('하루 평균 판매량',b/c,'개'),row('현재 속도에서 남은 기간',a/(b/c),'일')];break;
case '016':integer(b);integer(c);need(a>0&&b>0,'일 판매량과 조달 일수는 0보다 커야 합니다.');out=[row('조달 기간 예상 판매',a*b,'개'),row('단순 발주점',ceil(a*b+c),'개')];break;
case '017':out=[row('지금 순회수액',a),row('기다림 비용 차감 후',b-c),row('기다림의 차이',b-c-a)];break;
case '018':pct(b);pct(d);out=[row('상품 A 기여금',a*b/100),row('상품 B 기여금',c*d/100),row('B−A 차이',c*d/100-a*b/100)];break;
case '019':need(d<100,'수수료율은 100% 미만이어야 합니다.');integer(f);need(f>0,'기존 주문은 1건 이상이어야 합니다.');{const old=a*(1-d/100)-c-e,now=b*(1-d/100)-c-e;need(old>0&&now>0,'이 도구는 인상 전후 기여금이 양수인 경우에 사용합니다.');out=[row('기존 주문 기여금',old),row('새 주문 기여금',now),row('기존 합계 유지 필요 주문',ceil(old*f/now),'건')];}break;
default:throw Error('지원하지 않는 계산');}
need(out.every(r=>Number.isFinite(r.value)&&Math.abs(r.value)<=Number.MAX_SAFE_INTEGER),'계산 범위를 넘었습니다. 금액이나 수량을 줄여 주세요.');return out;
}const r=document.getElementById('mdtool-005'),form=r.querySelector('form'),out=r.querySelector('[role=status]');function render(){try{const rows=compute('005',Array.from(form.querySelectorAll('input')).map(x=>x.value));out.replaceChildren(...rows.map(o=>{const d=document.createElement('div');d.className='result';d.textContent=o.label;const b=document.createElement('b');b.textContent=o.value.toLocaleString('ko-KR',{maximumFractionDigits:o.unit==='원'?0:2})+o.unit;d.append(b);return d;}));}catch(e){out.textContent=e.message;}}form.addEventListener('input',render);form.addEventListener('submit',e=>e.preventDefault());r.querySelector('[data-reset]').onclick=()=>{form.reset();render();};render();})();</script></section></main></div></body></html><style id="editorial-v2">.md-article{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif!important;font-size:18px!important;line-height:1.88!important;color:#283a37!important;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.015em}
