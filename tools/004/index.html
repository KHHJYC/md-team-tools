<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>무료배송 기준 계산기</title><style>body{margin:0;background:#f7f3eb;color:#263b32;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:28px;background:white;font-size:18px;line-height:1.9}h1{font-size:32px;line-height:1.45}h2{font-size:25px;line-height:1.5;margin-top:42px}img{width:100%;height:auto}figure{margin:28px 0}figcaption,small{font-size:14px;color:#52645b}table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:10px;border:1px solid #ccd7cf;overflow-wrap:anywhere}a{color:#166444}@media(max-width:480px){main{padding:16px;font-size:17px}h1{font-size:27px}th,td{padding:5px;font-size:13px}}</style><main class="md-article"><section id="md-shipping-tool" aria-label="무료배송 기준 계산기">
<style>#md-shipping-tool{font-family:system-ui,sans-serif;background:#f3f7f4;border:1px solid #cbd8cf;border-radius:16px;padding:20px;margin:28px 0;color:#173d32;box-sizing:border-box}#md-shipping-tool *{box-sizing:border-box}#md-shipping-tool form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:16px}#md-shipping-tool label{display:block;font-size:16px}#md-shipping-tool input{display:block;width:100%;padding:12px;border:1px solid #779388;border-radius:7px;font-size:18px;margin-top:7px}#md-shipping-tool button{padding:12px 18px;margin-top:18px;border:0;background:#204f40;color:white;border-radius:8px;font-size:16px}#md-shipping-tool [role=status]{line-height:1.8;padding:16px 0;overflow-wrap:anywhere}#md-shipping-tool input:focus,#md-shipping-tool button:focus{outline:3px solid #ca6238;outline-offset:3px}</style>
<h3>우리 상품의 무료배송 기준 비교</h3><p>상품 매출에서 원가·수수료를 뺀 비율을 입력하세요. 배송비를 이미 뺀 비율은 넣지 않습니다.</p><form><label>배송·포장 전 기여율 (%)<input name="rate" type="number" min="0" step="any" value="35" required></label><label>실제 택배비 (원)<input name="ship" type="number" min="0" step="any" value="3000" required></label><label>포장비 (원)<input name="pack" type="number" min="0" step="any" value="500" required></label><label>목표 주문 기여금 (원)<input name="target" type="number" min="0" step="any" value="7000" required></label><label>기존 상품 주문액 (원)<input name="old" type="number" min="0" step="any" value="20000" required></label><label>기존 고객 배송비 (원)<input name="paid" type="number" min="0" step="any" value="3000" required></label></form><button type="button">예시로 초기화</button><div role="status" aria-live="polite"></div>
<p>목표 기준 = (목표 기여금 + 택배비 + 포장비) ÷ 기여율(소수). 기존 수준 유지 기준 = 기존 상품 주문액 + 기존 고객 배송비 ÷ 기여율(소수).</p><p>최소 주문액은 원 단위 올림. 기여금은 원 단위 반올림 표시. 같은 기여율·택배비·포장비를 유지하고 고객 배송비에 별도 수수료가 없다고 가정합니다. 광고비·고정비·반품·부가세 효과는 제외합니다. 입력값은 전송하거나 저장하지 않습니다.</p><noscript><p>JavaScript가 꺼져 있습니다. 예시: (7,000 + 3,000 + 500) ÷ 0.35 = 30,000원. 기존 수준 유지: 20,000 + 3,000 ÷ 0.35 ≈ 28,572원(올림).</p></noscript>
<script>(()=>{function calculateShipping(v){
for(const key of ['rate','ship','pack','target','old','paid']){if(v[key]===undefined||String(v[key]).trim()===''||!Number.isFinite(Number(v[key]))||Number(v[key])<0)throw Error('빈칸 없이 0 이상의 숫자를 입력해 주세요.');}
const n=Object.fromEntries(Object.entries(v).map(([k,x])=>[k,Number(x)]));
if(n.rate<=0||n.rate>100)throw Error('기여율은 0보다 크고 100 이하로 입력해 주세요.');
const r=n.rate/100; const up=x=>Math.ceil(x-Number.EPSILON*Math.max(1,Math.abs(x))*4);
return {target:up((n.target+n.ship+n.pack)/r),maintain:up(n.old+n.paid/r),extra:up(n.paid/r),before:n.old*r+n.paid-n.ship-n.pack};
}
const root=document.getElementById('md-shipping-tool'), form=root.querySelector('form'), result=root.querySelector('[role=status]');
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
function render(){try{const r=calculateShipping(Object.fromEntries(new FormData(form)));result.textContent=`목표 기여금을 남기는 기준: ${fmt(r.target)}원 / 기존 주문 수준 유지 기준: ${fmt(r.maintain)}원 / 필요한 추가 구매액: ${fmt(r.extra)}원 / 기존 주문 기여금: ${fmt(r.before)}원`;}catch(e){result.textContent=e.message;}}
form.addEventListener('input',render);form.addEventListener('submit',e=>e.preventDefault());root.querySelector('button').addEventListener('click',()=>{form.reset();render();});render();})();</script></section></main></html><style id="editorial-v2">.md-article{font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif!important;font-size:18px!important;line-height:1.88!important;color:#283a37!important;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:-.015em}
